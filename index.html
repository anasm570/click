<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>📄 Paper.io 2 – أونلاين (يدعم اللمس)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a2f3a, #0a1f2a);
            font-family: 'Segoe UI', 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }
        .game-container {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 15px;
            border: 1px solid #ffcc88;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 24px;
            background: #1a2a2a;
            box-shadow: 0 8px 20px black;
            width: 100%;
            height: auto;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            background: #00000066;
            border-radius: 60px;
            padding: 8px 16px;
            color: #ffefb9;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 8px;
        }
        .touch-buttons {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 200;
            pointer-events: auto;
        }
        .touch-btn {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 2px solid #ffaa66;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        .touch-btn:active {
            transform: scale(0.95);
            background: #e67e22;
        }
        .login-screen {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .login-card {
            background: #2c3e2f;
            border-radius: 60px;
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #ffaa55;
        }
        .login-card input, .login-card button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
        }
        .login-card input { background: #1e2e3a; color: white; text-align: center; }
        .login-card button { background: #e67e22; color: white; font-weight: bold; cursor: pointer; }
        .status { background: #00000066; border-radius: 40px; padding: 8px; text-align: center; margin-top: 10px; font-size: 0.75rem; }
        @media (max-width: 600px) {
            .touch-btn { width: 55px; height: 55px; font-size: 1.6rem; }
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h2>📄 Paper.io 2</h2>
        <p>سجل دخولك باستخدام الاسم ورقم الهاتف</p>
        <input type="text" id="loginName" placeholder="الاسم">
        <input type="tel" id="loginPhone" placeholder="رقم الهاتف">
        <button id="loginBtn">🎮 دخول / تسجيل</button>
        <div id="loginError" style="color:#ffaaaa; margin-top:10px;"></div>
        <div style="font-size:0.7rem; margin-top:15px;">🔐 إذا كان الاسم والرقم جديدين، سيتم إنشاء حساب. حفظ التقدم في الخادم (ذاكرة مؤقتة).</div>
    </div>
</div>

<div id="gameArea" style="display:none;">
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div class="info-panel">
            <span>👤 <span id="playerName"></span></span>
            <span>⭐ النقاط: <span id="score">0</span></span>
            <span>⚡ السرعة: Lv <span id="speedLv">1</span></span>
            <span>🏆 الترتيب: <span id="rank">-</span></span>
        </div>
        <div class="status" id="statusMsg">🕹️ استخدم الأزرار على الشاشة أو لوحة المفاتيح (↑ ↓ ← →)</div>
    </div>
    <div class="touch-buttons">
        <div class="touch-btn" data-dir="up">▲</div>
        <div class="touch-btn" data-dir="left">◀</div>
        <div class="touch-btn" data-dir="down">▼</div>
        <div class="touch-btn" data-dir="right">▶</div>
    </div>
</div>

<script>
    const socket = io();
    let canvas = document.getElementById('gameCanvas');
    let ctx = canvas.getContext('2d');
    let myId = null;
    let players = {};
    let myPlayer = null;
    let mapGrid = [];
    let animationId = null;
    const CELL_SIZE = 20;
    const MAP_W = 30, MAP_H = 30;
    canvas.width = MAP_W * CELL_SIZE;
    canvas.height = MAP_H * CELL_SIZE;

    // أزرار اللمس
    const touchBtns = document.querySelectorAll('.touch-btn');
    touchBtns.forEach(btn => {
        const dir = btn.getAttribute('data-dir');
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            socket.emit('move', dir);
        });
        btn.addEventListener('mousedown', () => socket.emit('move', dir));
    });

    // تسجيل الدخول
    const loginScreen = document.getElementById('loginScreen');
    const gameArea = document.getElementById('gameArea');
    const loginName = document.getElementById('loginName');
    const loginPhone = document.getElementById('loginPhone');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const playerNameSpan = document.getElementById('playerName');
    const scoreSpan = document.getElementById('score');
    const speedLvSpan = document.getElementById('speedLv');
    const rankSpan = document.getElementById('rank');
    const statusMsgDiv = document.getElementById('statusMsg');

    loginBtn.onclick = async () => {
        const name = loginName.value.trim();
        const phone = loginPhone.value.trim();
        if (!name || !phone) { loginError.innerText = 'الرجاء إدخال الاسم ورقم الهاتف'; return; }
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            playerNameSpan.innerText = name;
            socket.emit('login', { name, phone });
            loginScreen.style.display = 'none';
            gameArea.style.display = 'block';
        } catch(err) {
            loginError.innerText = `❌ خطأ: ${err.message}`;
        }
    };

    // أحداث Socket
    socket.on('init', (data) => {
        myId = data.player.id;
        myPlayer = data.player;
        players = {};
        data.players.forEach(p => { players[p.id] = p; });
        mapGrid = data.map;
        updateUI();
        startGameLoop();
    });

    socket.on('player-joined', (p) => {
        players[p.id] = p;
    });

    socket.on('player-left', (id) => {
        delete players[id];
    });

    socket.on('player-move', (move) => {
        if (players[move.id]) {
            players[move.id].x = move.x;
            players[move.id].y = move.y;
            players[move.id].trail = move.trail;
        }
        if (move.id === myId && myPlayer) {
            myPlayer.x = move.x;
            myPlayer.y = move.y;
            myPlayer.trail = move.trail;
        }
    });

    socket.on('game-over', (data) => {
        statusMsgDiv.innerText = `😵 لقد مت! سيتم إعادة تشكيلك بعد ثانيتين. النقاط: ${data.score}`;
        setTimeout(() => statusMsgDiv.innerText = 'استخدم الأزرار للتحرك', 2000);
    });

    socket.on('respawn', (pos) => {
        if (myPlayer) {
            myPlayer.x = pos.x;
            myPlayer.y = pos.y;
            myPlayer.trail = [];
        }
    });

    function updateUI() {
        if (myPlayer) {
            scoreSpan.innerText = myPlayer.score;
            speedLvSpan.innerText = myPlayer.speed;
            let sorted = Object.values(players).sort((a,b) => b.score - a.score);
            let rank = sorted.findIndex(p => p.id === myId) + 1;
            rankSpan.innerText = rank > 0 ? rank : '-';
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < MAP_W; i++) {
            for (let j = 0; j < MAP_H; j++) {
                let owner = mapGrid[i]?.[j];
                let color = owner && players[owner] ? players[owner].color : '#2a3a3a';
                ctx.fillStyle = color;
                ctx.fillRect(i*CELL_SIZE, j*CELL_SIZE, CELL_SIZE-1, CELL_SIZE-1);
            }
        }
        for (let id in players) {
            let p = players[id];
            if (p.trail && p.trail.length) {
                ctx.fillStyle = p.color;
                for (let t of p.trail) {
                    ctx.fillRect(t.x*CELL_SIZE, t.y*CELL_SIZE, CELL_SIZE-1, CELL_SIZE-1);
                }
            }
        }
        for (let id in players) {
            let p = players[id];
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x*CELL_SIZE + CELL_SIZE/2, p.y*CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, 2*Math.PI);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px Arial';
            ctx.fillText(p.name.substring(0,2), p.x*CELL_SIZE+4, p.y*CELL_SIZE+14);
        }
    }

    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') socket.emit('move', 'up');
        if (e.key === 'ArrowDown') socket.emit('move', 'down');
        if (e.key === 'ArrowLeft') socket.emit('move', 'left');
        if (e.key === 'ArrowRight') socket.emit('move', 'right');
        e.preventDefault();
    });

    function startGameLoop() {
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        animate();
        setInterval(() => updateUI(), 200);
    }
</script>
</body>
</html>
